services:
  - type: web
    name: skillcart-company-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerdb
          property: connectionString

databases:
  - name: careerdb
    databaseName: careerdb
    user: postgres
    plan: free
